<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background:#f4f6f6;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin: 0;
        }
        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10 px rgba(0,0,0,0,1);
            width:350px;
            text-align:center;
        }
        h1{
        color:#999;
        margin-bottom:20px;
        }
        input {
            width:90%;
            padding:10px;
            margin:8px 0;
            border: 1px solid #ccc;
            border-radius:5px;
            font-size:14px;
        }
        button {
            width:95%;
             padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius:5px;
            cursor: pointer;
            font-size:16px;
            margin-top:10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error{
            color:red;
            font-size:14px;
            margin-bottom:10px
        }
        a{
            color:#007bff;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <h1>Login</h1>
    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <p>New user? <a href="{% url 'signup' %}">Sign Up</a></p>
</body>
</html>
