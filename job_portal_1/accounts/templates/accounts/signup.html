<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <style>
        body{
          font-family: Arial;
          background:#f4f6f9;
          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          margin: 0;
        }
        .container{
           background:white;
           padding:30px;
           border-radius:10px;
           box-shadow:0 4px 10px rgba(0,0,0,0.1);
           width:350px;
           text-align:center;
        }
        input{
           width:90%;
           padding:10px;
           margin:8px 0;
           border: 1px solid #ccc;
           border-radius:5px;
        }
        button{
           width:95%;
           padding:10px;
           background:#28a745;
           color:white;
           border:none;
           border-radius:5px;
           cursor:pointer;
        }
        button:hover{
           background:#218838;
        }
        .error{
           color:red;
        }

    </style>
</head>
<body>
     <h1>Signup</h1>
     {% if messages %}
         {% for message in messages %}
             <p class="error">{{message}}</p>
         {% endfor %}
     {% endif %}
     <form method="POST">
         {% csrf_token %}
         <input type="text" name="username" placeholder="Username" required><br><br>
         <input type="email" name="email" placeholder="Email" required><br><br>
         <input type="text" name="phone" placeholder="Phone" required><br><br>
         <input type="password" name="password1" placeholder="Password" required><br><br>
         <input type="password" name="password2" placeholder="Confirm Password" required><br><br>
         <button type="submit">Sign Up</button>
         <label>Register as:</label><br>
         <select name="is_employee" required>
             <option value="False">Student/Job Seeker</option>
             <option value="True">Company/Employer</option>
         </select><br><br>
     </form>
     <p>Already have account? <a href="{% url 'login' %}">Login</a></p>
</body>
</html>
